<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>占い入力フォーム</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.4);
      --border-color: #334155;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    [data-theme="snack"] {
      --bg-color: #120018;
      --card-bg: #22082e;
      --text-color: #fce7f3;
      --accent-color: #ec4899;
      --accent-glow: rgba(236, 72, 153, 0.4);
      --border-color: #4c1d95;
    }

    [data-theme="gal"] {
      --bg-color: #fff0f6;
      --card-bg: #ffffff;
      --text-color: #292524;
      --accent-color: #ff2a85;
      --accent-glow: rgba(255, 42, 133, 0.3);
      --border-color: #fbcfe8;
    }

    [data-theme="scientist"] {
      --bg-color: #051014;
      --card-bg: #0b1d24;
      --text-color: #e0f2fe;
      --accent-color: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.4);
      --border-color: #115e59;
      --font-family: "Courier New", Consolas, monospace, sans-serif;
    }

    [data-theme="alien"] {
      --bg-color: #08061a;
      --card-bg: #131035;
      --text-color: #e0e7ff;
      --accent-color: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --border-color: #312e81;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    .header-card, .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    h1 { font-size: 1.5rem; margin-bottom: 8px; text-align: center; color: var(--accent-color); }
    p.description { font-size: 0.95rem; opacity: 0.9; margin-bottom: 12px; }

    .portal-grid {
      display: grid;
      gap: 16px;
      margin-top: 20px;
    }
    .portal-link {
      display: block;
      padding: 20px;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-color);
      text-decoration: none;
      font-weight: bold;
      text-align: center;
      transition: all 0.2s;
    }
    .portal-link:hover {
      border-color: var(--accent-color);
      box-shadow: 0 4px 16px var(--accent-glow);
      transform: translateY(-2px);
    }

    .q-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .q-badge.secret { background: #ea580c; color: #ffffff; }
    .q-badge.public { background: #0284c7; color: #ffffff; }

    .q-title { font-size: 1.05rem; font-weight: bold; margin-bottom: 12px; }

    .choice-option {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      margin-bottom: 8px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }
    .choice-option:hover {
      border-color: var(--accent-color);
    }
    .choice-option input[type="radio"] {
      margin-right: 12px;
      accent-color: var(--accent-color);
      transform: scale(1.2);
    }

    .input-field {
      width: 100%;
      padding: 14px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.2);
      color: var(--text-color);
      font-size: 1.1rem;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
    }
    .input-field:focus { border-color: var(--accent-color); }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--accent-glow);
      transition: transform 0.1s;
    }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .loading-overlay {
      text-align: center;
      padding: 40px 0;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border-color);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .success-card {
      text-align: center;
      padding: 40px 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ブース未指定時のポータルメニュー -->
  <div id="portal-view" style="display: none;">
    <div class="header-card">
      <h1>🔮 占いブース入力選択</h1>
      <p class="description" style="text-align: center;">開校記念祭 占い館システムへようこそ。<br>使用するブースを選択してください。</p>
    </div>
    <div class="portal-grid">
      <a href="?booth=snack" class="portal-link" style="border-color: #ec4899;">① スナックママの人生の転機占い</a>
      <a href="?booth=gal" class="portal-link" style="border-color: #ff2a85;">② ギャルの恋愛占い</a>
      <a href="?booth=scientist" class="portal-link" style="border-color: #10b981;">③ マッドサイエンティストの元素占い</a>
      <a href="?booth=alien" class="portal-link" style="border-color: #6366f1;">④ 宇宙人の未知の才能占い</a>
    </div>
  </div>

  <!-- 占い入力フォーム -->
  <div id="form-view" style="display: none;">
    <div class="header-card">
      <h1 id="booth-title">読み込み中...</h1>
      <p id="booth-desc" class="description"></p>
    </div>

    <form id="fortune-form">
      <div id="questions-container"></div>

      <!-- QRコード番号入力 -->
      <div class="card">
        <label for="qr-index" class="q-title" style="display: block; text-align: center;">
          🎫 QRコード番号（4桁）を入力
        </label>
        <p class="description" style="text-align: center; font-size: 0.85rem; margin-bottom: 12px;">
          渡すカードに印字された4桁の番号（例: 1007）を入力してください。
        </p>
        <input type="number" id="qr-index" class="input-field" placeholder="1001" required min="1000" max="9999">
      </div>

      <button type="submit" id="submit-btn" class="btn-submit">🔮 運勢を決定して送信する</button>
    </form>
  </div>

  <!-- ローディング表示 -->
  <div id="loading-view" class="card loading-overlay">
    <div class="spinner"></div>
    <p id="loading-msg">ブースの情報を取得しています...</p>
  </div>

  <!-- 送信完了画面 -->
  <div id="success-view" class="card success-card" style="display: none;">
    <h2 style="color: var(--accent-color); margin-bottom: 12px;">✨ 占いが完了しました！</h2>
    <p class="description">結果がスプレッドシートに保存されました。</p>

    <!-- 渡すQRコード番号の emphasized 表示 -->
    <div style="background: rgba(0, 0, 0, 0.3); border: 2px dashed var(--accent-color); border-radius: 12px; padding: 16px; margin: 16px 0;">
      <div style="font-size: 0.9rem; opacity: 0.8;">お客さんに渡す紙の番号</div>
      <div id="submitted-qr-index" style="font-size: 2.2rem; font-weight: bold; color: var(--accent-color); letter-spacing: 2px; margin: 4px 0;">
        ----
      </div>
      <div style="font-size: 0.85rem;">上記番号の<b>「QRコードの紙」</b>と<b>「パワーストーン」</b>をお渡しください。</div>
    </div>

    <button type="button" id="next-person-btn" class="btn-submit" style="margin-top: 12px;">次の人を占う</button>
  </div>
</div>

<script>
  // ★ ここにご自身のGAS Web App URLを入力してください
  const GAS_URL = "https://script.google.com/macros/s/AKfycbw0CFCs9TFZH2EkK7TbYMT6GUL_pPHqEhqcNoA1LK1z3SyG99Z7mOcyTj5MD203ZnIS/exec";

  const urlParams = new URLSearchParams(window.location.search);
  const booth = urlParams.get('booth');

  const portalView = document.getElementById('portal-view');
  const formView = document.getElementById('form-view');
  const loadingView = document.getElementById('loading-view');
  const successView = document.getElementById('success-view');

  if (!booth) {
    loadingView.style.display = 'none';
    portalView.style.display = 'block';
  } else {
    document.documentElement.setAttribute('data-theme', booth);
    loadQuestions();
  }

  async function loadQuestions() {
    try {
      const response = await fetch(`${GAS_URL}?action=getQuestions&booth=${booth}`);
      const json = await response.json();

      if (!json.success) throw new Error(json.message || "質問データの取得に失敗しました");

      renderForm(json.data);
    } catch (err) {
      alert("エラー: " + err.message);
    } finally {
      loadingView.style.display = 'none';
    }
  }

  function renderForm(data) {
    document.getElementById('booth-title').textContent = data.concept.title;
    document.getElementById('booth-desc').textContent = data.concept.description;

    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    data.questions.forEach((q, qIndex) => {
      const card = document.createElement('div');
      card.className = 'card';

      const badge = document.createElement('span');
      badge.className = `q-badge ${q.secret ? 'secret' : 'public'}`;
      badge.textContent = q.secret ? '【占い師用入力】' : '【お客さん回答】';

      const title = document.createElement('div');
      title.className = 'q-title';
      title.textContent = `Q${q.index || qIndex + 1}. ${q.description}`;

      card.appendChild(badge);
      card.appendChild(title);

      q.choices.forEach(c => {
        const option = document.createElement('label');
        option.className = 'choice-option';
        option.innerHTML = `
          <input type="radio" name="question_${qIndex}" value="${c.index}" required>
          <span>${c.description}</span>
        `;
        card.appendChild(option);
      });

      container.appendChild(card);
    });

    formView.style.display = 'block';
  }

  // フォーム送信処理
  document.getElementById('fortune-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const qrIndexInput = document.getElementById('qr-index');
    const qrIndex = qrIndexInput.value;
    const choices = document.querySelectorAll('#questions-container .card');
    const answers = [];

    for (let i = 0; i < choices.length; i++) {
      const selected = document.querySelector(`input[name="question_${i}"]:checked`);
      if (!selected) {
        alert(`未回答の質問があります (Q${i + 1})`);
        return;
      }
      answers.push(Number(selected.value));
    }

    const payload = {
      action: "saveFortune",
      data: {
        boothName: booth,
        resultIndex: Number(qrIndex),
        answers: answers
      }
    };

    formView.style.display = 'none';
    loadingView.style.display = 'block';
    document.getElementById('loading-msg').textContent = "占い結果を計算・保存しています...";

    try {
      const response = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      });
      const json = await response.json();

      if (!json.success) throw new Error(json.message || "保存に失敗しました");

      // 1. 送信完了画面にQRコード番号を反映
      document.getElementById('submitted-qr-index').textContent = `No. ${qrIndex}`;

      loadingView.style.display = 'none';
      successView.style.display = 'block';
    } catch (err) {
      alert("送信エラー: " + err.message);
      loadingView.style.display = 'none';
      formView.style.display = 'block';
    }
  });

  // 2. 「次の人を占う」ボタン押下時：前回の選択値をクリアして高速再開
  document.getElementById('next-person-btn').addEventListener('click', () => {
    // フォーム要素全体をリセット（ラジオボタンとQRコード番号の入力をクリア）
    document.getElementById('fortune-form').reset();

    // 表示切り替え（GASへの再通信は行わず、質問フォームを表示）
    successView.style.display = 'none';
    formView.style.display = 'block';

    // 画面一番上へスクロール
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>

</body>
</html>
