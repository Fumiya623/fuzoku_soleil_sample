<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>あなたの占い結果</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.4);
      --border-color: #334155;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    [data-theme="snack"] {
      --bg-color: #120018;
      --card-bg: #22082e;
      --text-color: #fce7f3;
      --accent-color: #ec4899;
      --accent-glow: rgba(236, 72, 153, 0.4);
      --border-color: #4c1d95;
    }

    [data-theme="gal"] {
      --bg-color: #fff0f6;
      --card-bg: #ffffff;
      --text-color: #292524;
      --accent-color: #ff2a85;
      --accent-glow: rgba(255, 42, 133, 0.3);
      --border-color: #fbcfe8;
    }

    [data-theme="scientist"] {
      --bg-color: #051014;
      --card-bg: #0b1d24;
      --text-color: #e0f2fe;
      --accent-color: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.4);
      --border-color: #115e59;
      --font-family: "Courier New", Consolas, monospace, sans-serif;
    }

    [data-theme="alien"] {
      --bg-color: #08061a;
      --card-bg: #131035;
      --text-color: #e0e7ff;
      --accent-color: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --border-color: #312e81;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    .timestamp { font-size: 0.8rem; opacity: 0.7; text-align: right; margin-bottom: 8px; }
    h1 { font-size: 1.4rem; text-align: center; color: var(--accent-color); margin-bottom: 12px; }

    .hero-card {
      text-align: center;
      border: 2px solid var(--accent-color);
    }
    .hero-title {
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--accent-color);
      margin: 8px 0;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: bold;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 6px;
      margin-bottom: 16px;
      color: var(--accent-color);
    }

    .aspect-item {
      margin-bottom: 18px;
    }
    .aspect-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .bar-fill {
      height: 100%;
      background: var(--accent-color);
      width: 0%;
      transition: width 1s ease-out;
    }
    .aspect-eval { font-size: 0.9rem; opacity: 0.95; }

    .souvenir-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed var(--accent-color);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-top: 20px;
    }

    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.2);
      color: var(--text-color);
      resize: vertical;
      min-height: 80px;
      margin-bottom: 12px;
    }
    .btn-feedback {
      padding: 10px 20px;
      background: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border-color);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 40px auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="container">
  <!-- ローディング表示 -->
  <div id="loading" class="card" style="text-align: center; padding: 40px 20px;">
    <div class="spinner"></div>
    <p>占い結果を読み込んでいます...</p>
  </div>

  <!-- エラー表示 -->
  <div id="error-card" class="card" style="display: none; text-align: center; color: #ef4444;">
    <h2>⚠️ エラー</h2>
    <p id="error-msg">占い結果が見つかりませんでした。</p>
  </div>

  <!-- メイン結果画面 -->
  <div id="result-content" style="display: none;">
    <!-- ヘッダーカード -->
    <div class="card">
      <div id="timestamp" class="timestamp"></div>
      <h1 id="concept-title">占い結果</h1>
      <p id="concept-desc" style="font-size: 0.95rem; text-align: center; opacity: 0.9;"></p>
    </div>

    <!-- 診断されたキャラクター -->
    <div class="card hero-card">
      <div style="font-size: 0.85rem; opacity: 0.8;">あなたを象徴するキャラクター</div>
      <div id="char-title" class="hero-title">...</div>
      <p id="char-desc" style="font-size: 0.95rem;"></p>
    </div>

    <!-- 授かられた格言 -->
    <div class="card">
      <div class="section-title">📜 占い師からのアドバイス</div>
      <h3 id="proverb-title" style="margin-bottom: 6px; color: var(--accent-color);"></h3>
      <p id="proverb-desc" style="font-size: 0.95rem;"></p>
    </div>

    <!-- 観点別分析 -->
    <div class="card">
      <div class="section-title">📊 運勢・属性分析</div>
      <div id="aspects-list"></div>
    </div>

    <!-- パワーストーンお土産案内 -->
    <div class="souvenir-box card">
      <h3>💎 パワーストーンのお土産</h3>
      <p style="font-size: 0.9rem; margin-top: 4px;">
        占い後に受け取ったパワーストーンはお守りとしてお持ち帰りいただけます。<br>
        この結果画面は後からいつでも見返すことができます。
      </p>
    </div>

    <!-- フィードバック・不具合報告フォーム -->
    <div class="card">
      <div class="section-title">💬 感想・不具合の報告</div>
      <form id="feedback-form">
        <textarea id="feedback-text" placeholder="占いの感想や、不具合の報告をご記入ください（任意）" required></textarea>
        <button type="submit" class="btn-feedback">送信する</button>
      </form>
    </div>
  </div>
</div>

<script>
  // ★ ここにご自身のGAS Web App URLを入力してください
  const GAS_URL = "https://script.google.com/macros/s/AKfycbw0CFCs9TFZH2EkK7TbYMT6GUL_pPHqEhqcNoA1LK1z3SyG99Z7mOcyTj5MD203ZnIS/exec";

  const urlParams = new URLSearchParams(window.location.search);
  const index = urlParams.get('index');
  const name = urlParams.get('name');

  const loading = document.getElementById('loading');
  const errorCard = document.getElementById('error-card');
  const resultContent = document.getElementById('result-content');

  if (!index || !name) {
    showError("無効なQRコードURLです。パラメータが含まれていません。");
  } else {
    fetchResult();
  }

  async function fetchResult() {
    try {
      const response = await fetch(`${GAS_URL}?action=getResult&index=${index}&name=${encodeURIComponent(name)}`);
      const json = await response.json();

      if (!json.success) throw new Error(json.message || "結果の取得に失敗しました");

      renderResult(json.data);
    } catch (err) {
      showError(err.message);
    }
  }

  function showError(msg) {
    loading.style.display = 'none';
    document.getElementById('error-msg').textContent = msg;
    errorCard.style.display = 'block';
  }

  function renderResult(data) {
    // ブーステーマの設定 (1:snack, 2:gal, 3:scientist, 4:alien のように判定)
    const boothMap = { 1: 'snack', 2: 'gal', 3: 'scientist', 4: 'alien' };
    const themeKey = boothMap[data.concept.index] || 'snack';
    document.documentElement.setAttribute('data-theme', themeKey);

    document.getElementById('timestamp').textContent = data.timestamp || '';
    document.getElementById('concept-title').textContent = data.concept.title;
    document.getElementById('concept-desc').textContent = data.concept.description;

    document.getElementById('char-title').textContent = data.character.title;
    document.getElementById('char-desc').textContent = data.character.description;

    document.getElementById('proverb-title').textContent = data.proverb.title;
    document.getElementById('proverb-desc').textContent = data.proverb.description;

    const aspectsContainer = document.getElementById('aspects-list');
    aspectsContainer.innerHTML = '';

    data.aspects.forEach(asp => {
      const item = document.createElement('div');
      item.className = 'aspect-item';
      
      const score = Math.min(Math.max(asp.score, 0), 100);

      item.innerHTML = `
        <div class="aspect-header">
          <span>${asp.title}</span>
          <span>${score} pt</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill" style="width: ${score}%;"></div>
        </div>
        <div style="font-size: 0.8rem; opacity: 0.8; margin-bottom: 2px;">${asp.description}</div>
        <div class="aspect-eval">💬 ${asp.evaluation}</div>
      `;
      aspectsContainer.appendChild(item);
    });

    loading.style.display = 'none';
    resultContent.style.display = 'block';
  }

  // フィードバック送信処理
  document.getElementById('feedback-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    const text = document.getElementById('feedback-text').value;

    btn.disabled = true;
    btn.textContent = '送信中...';

    try {
      const response = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action: "postFeedback",
          data: {
            index: Number(index),
            text: text
          }
        })
      });
      const json = await response.json();

      if (!json.success) throw new Error(json.message);

      alert("ご意見・感想を送信しました。ありがとうございました！");
      document.getElementById('feedback-text').value = '';
    } catch (err) {
      alert("送信失敗: " + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '送信する';
    }
  });
</script>

</body>
</html>
