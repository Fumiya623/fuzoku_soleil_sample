<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>占い入力フォーム</title>
  <meta name="description" content="金沢大学附属高校第79回開校記念祭における有志模擬店「Soleil」で使用する占いプログラムの回答入力ページ">
  <meta name="author" content="金沢大学附属高校78回生有志">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.4);
      --border-color: #334155;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    [data-theme="gal"] {
      --bg-color: #ffe1ed;
      --card-bg: #fff0f6;
      --text-color: #292524;
      --accent-color: #ff2a85;
      --accent-glow: rgba(255, 42, 133, 0.3);
      --border-color: #fbcfe8;
    }

    [data-theme="snack"] {
      --bg-color: #120018;
      --card-bg: #22082e;
      --text-color: #fce7f3;
      --accent-color: #ec4899;
      --accent-glow: rgba(236, 72, 153, 0.4);
      --border-color: #4c1d95;
    }

    [data-theme="element"] {
      --bg-color: #051014;
      --card-bg: #0b1d24;
      --text-color: #e0f2fe;
      --accent-color: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.4);
      --border-color: #115e59;
    }

    [data-theme="alien"] {
      --bg-color: #08061a;
      --card-bg: #131035;
      --text-color: #e0e7ff;
      --accent-color: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --border-color: #312e81;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    .header-card, .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    h1 { font-size: 1.5rem; margin-bottom: 8px; text-align: center; color: var(--accent-color); }
    p.description { font-size: 0.95rem; opacity: 0.9; margin-bottom: 12px; }

    .portal-grid {
      display: grid;
      gap: 16px;
      margin-top: 20px;
    }
    .portal-link {
      display: block;
      padding: 20px;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-color);
      text-decoration: none;
      font-weight: bold;
      text-align: center;
      transition: all 0.2s;
    }
    .portal-link:hover {
      border-color: var(--accent-color);
      box-shadow: 0 4px 16px var(--accent-glow);
      transform: translateY(-2px);
    }

    .q-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .q-badge.secret { background: #ea580c; color: #ffffff; }
    .q-badge.public { background: #0284c7; color: #ffffff; }

    .q-title { font-size: 1.05rem; font-weight: bold; margin-bottom: 12px; }

    /* 質問カードの表示切り替え */
    .question-card {
      display: none; /* 基本は非表示にし、活性化している問だけ表示 */
    }
    .question-card.active {
      display: block;
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 進行状況バー（プログレスバー） */
    .progress-container {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      height: 8px;
      border-radius: 4px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: var(--accent-color);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* 選択肢のレイアウト設定 */
    /* デフォルト（横長リスト） */
    .choices-container.list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    /* 画像対応用（正方形・グリッド配置） */
    .choices-container.grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    /* 選択肢カードのスタイル調整 */
    .choice-option {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease;
      text-align: center;
    }
    .choice-option:hover {
      border-color: var(--accent-color);
    }
    .choice-option input[type="radio"] {
      position: absolute;
      top: 10px;
      left: 10px;
      accent-color: var(--accent-color);
      transform: scale(1.2);
    }
    /* ラジオボタンが選択されている時のスタイル */
    .choice-option:has(input[type="radio"]:checked) {
      border-color: var(--accent-color);
      background: var(--accent-glow);
    }

    /* 選択肢画像のスタイル */
    .choice-image {
      width: 100%;
      aspect-ratio: 1 / 1; /* 正方形に固定 */
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    /* 前へ/次へ ナビゲーションボタン */
    .nav-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .btn-nav {
      flex: 1;
      padding: 14px;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      color: var(--text-color);
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-nav:hover {
      border-color: var(--accent-color);
    }
    .btn-nav.primary {
      background: var(--accent-color);
      color: #ffffff;
      border: none;
    }

    .input-field {
      width: 100%;
      padding: 14px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.15);
      color: var(--text-color);
      font-size: 1.1rem;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
    }
    .input-field:focus { border-color: var(--accent-color); }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--accent-glow);
      transition: transform 0.1s;
    }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .loading-overlay {
      text-align: center;
      padding: 40px 0;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border-color);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .success-card {
      text-align: center;
      padding: 40px 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ブース未指定時のポータルメニュー -->
  <div id="portal-view" style="display: none;">
    <div class="header-card">
      <h1>🔮 占いブース入力選択</h1>
      <p class="description" style="text-align: center;">こちらは占い師向けシステムです。<br>模擬店スタッフは使用するブースを選択してください。</p>
    </div>
    <div class="portal-grid">
      <a href="?booth=gal" class="portal-link" style="border-color: #ff2a85;">ギャルの恋愛占い</a>
      <a href="?booth=snack" class="portal-link" style="border-color: #ec4899;">スナックママの人生の転機占い</a>
      <a href="?booth=element" class="portal-link" style="border-color: #10b981;">マッドサイエンティストの元素占い</a>
      <a href="?booth=alien" class="portal-link" style="border-color: #6366f1;">宇宙人の未知の才能占い</a>
    </div>
  </div>

  <!-- 占い入力フォーム -->
  <div id="form-view" style="display: none;">
    <div class="header-card">
      <h1 id="booth-title">読み込み中...</h1>
    </div>

    <form id="fortune-form">
      <!-- 進行状態を示すプログレスバー -->
      <div class="progress-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <!-- 質問群とQRコード入力がここに入ります（JSでレンダリング） -->
      <div id="questions-container"></div>

      <!-- ステップ切替ナビゲーションボタン -->
      <div class="nav-buttons">
        <button type="button" id="prev-btn" class="btn-nav" style="display: none;">◀ 前の項目へ</button>
        <button type="button" id="next-btn" class="btn-nav primary">次の項目へ ▶</button>
        <button type="submit" id="submit-btn" class="btn-nav primary" style="display: none;">🔮 運勢を決定して送信する</button>
      </div>
    </form>
  </div>

  <!-- ローディング表示 -->
  <div id="loading-view" class="card loading-overlay">
    <div class="spinner"></div>
    <p id="loading-msg">ブースの情報を取得しています...</p>
  </div>

  <!-- 送信完了画面 -->
  <div id="success-view" class="card success-card" style="display: none;">
    <h2 style="color: var(--accent-color); margin-bottom: 12px;">✨ 占いが完了しました！</h2>
    <p class="description">結果が保存されました。</p>

    <!-- 渡すQRコード番号の emphasized 表示 -->
    <div style="background: rgba(0, 0, 0, 0.05); border: 2px dashed var(--accent-color); border-radius: 12px; padding: 16px; margin: 16px 0;">
      <div style="font-size: 0.9rem; opacity: 0.8;">結果の登録番号</div>
      <div id="submitted-qr-index" style="font-size: 2.2rem; font-weight: bold; color: var(--accent-color); letter-spacing: 2px; margin: 4px 0;">
        ----
      </div>
      <div style="font-size: 0.85rem;">上記番号の<b>QRコードの紙</b>を渡し、<br>ブースから出たら<b>パワーストーン</b>を受け取るよう伝えてください。</div>
    </div>

    <button type="button" id="next-person-btn" class="btn-submit" style="margin-top: 12px;">次の人を占う</button>
  </div>
</div>

<script>
  // GAS Web App URL
  const GAS_URL = "https://script.google.com/macros/s/AKfycbw0CFCs9TFZH2EkK7TbYMT6GUL_pPHqEhqcNoA1LK1z3SyG99Z7mOcyTj5MD203ZnIS/exec";

  const urlParams = new URLSearchParams(window.location.search);
  const booth = urlParams.get("booth");

  const portalView = document.getElementById("portal-view");
  const formView = document.getElementById("form-view");
  const loadingView = document.getElementById("loading-view");
  const successView = document.getElementById("success-view");

  let currentStep = 0;
  let totalSteps = 0;
  let questionCount = 0;

  if (!booth) {
    loadingView.style.display = "none";
    portalView.style.display = "block";
  } else {
    document.documentElement.setAttribute("data-theme", booth);
    loadQuestions();
  }

  async function loadQuestions() {
    try {
      const response = await fetch(`${GAS_URL}?action=getQuestions&booth=${booth}`);
      const json = await response.json();

      if (!json.success) throw new Error(json.message || "質問データの取得に失敗しました。");

      renderForm(json.data);
    } catch (err) {
      alert(err.message);
    } finally {
      loadingView.style.display = "none";
    }
  }

  function renderForm(data) {
    document.getElementById("booth-title").textContent = data.concept.title;

    const container = document.getElementById("questions-container");
    container.innerHTML = "";

    const questions = data.questions;
    questionCount = questions.length;
    
    // ステップ総数 = ブース説明(1) + 質問数(questionCount) + QR入力(1)
    totalSteps = 1 + questionCount + 1;

    // Step 0: ブースの説明カード（最初に表示）
    const conceptCard = document.createElement("div");
    conceptCard.className = "card question-card active";
    conceptCard.dataset.step = 0;
    conceptCard.innerHTML = `
      <div class="q-title" style="text-align: center; margin-bottom: 12px; color: var(--accent-color);">
        📜 いらっしゃいませ
      </div>
      <p class="description" style="font-size: 1.05rem; line-height: 1.8; text-align: left; white-space: pre-wrap;">${data.concept.description}</p>
    `;
    container.appendChild(conceptCard);

    // Step 1 〜 M: 各質問カード
    questions.forEach((q, qIndex) => {
      const card = document.createElement("div");
      card.className = "card question-card";
      card.dataset.step = qIndex + 1; // Step 1 から開始

      const badge = document.createElement("span");
      badge.className = `q-badge ${q.secret ? "secret" : "public"}`;
      badge.textContent = q.secret ? "占い師が入力" : "お客さんが回答";

      const title = document.createElement("div");
      title.className = "q-title";
      title.textContent = `Q${q.index || qIndex + 1}. ${q.description}`;

      card.appendChild(badge);
      card.appendChild(title);

      const isGrid = q.layout === "grid" || q.choices.some(c => c.imageUrl);
      const choicesWrapper = document.createElement("div");
      choicesWrapper.className = `choices-container ${isGrid ? "grid" : "list"}`;

      q.choices.forEach(c => {
        const option = document.createElement("label");
        option.className = "choice-option";
        
        let imgHtml = "";
        if (c.imageUrl) {
          imgHtml = `<img src="${c.imageUrl}" alt="${c.description}" class="choice-image">`;
        }

        option.innerHTML = `
          <input type="radio" name="question_${qIndex}" value="${c.index}" required>
          ${imgHtml}
          <span>${c.description}</span>
        `;
        choicesWrapper.appendChild(option);
      });

      card.appendChild(choicesWrapper);
      container.appendChild(card);
    });

    // Step M + 1: 最終ステップ（QRコード番号入力）
    const qrCard = document.createElement("div");
    qrCard.className = "card question-card";
    qrCard.dataset.step = 1 + questionCount;
    qrCard.innerHTML = `
      <label for="qr-index" class="q-title" style="display: block; text-align: center;">
        🎫 QRコード番号を入力
      </label>
      <p class="description" style="text-align: center; font-size: 0.85rem; margin-bottom: 12px;">
        渡すカードに印字された4桁の番号を入力してください。
      </p>
      <input type="number" id="qr-index" class="input-field" placeholder="0000" min="1000" max="9999">
    `;
    container.appendChild(qrCard);

    formView.style.display = "block";
    updateStepDisplay();
  }

  // ステップ表示およびナビゲーションボタンの切り替え
  function updateStepDisplay() {
    const cards = document.querySelectorAll(".question-card");
    cards.forEach((card, idx) => {
      card.classList.toggle("active", idx === currentStep);
    });

    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const submitBtn = document.getElementById("submit-btn");

    // 1. 「前の項目へ」ボタンの制御
    prevBtn.style.display = currentStep === 0 ? "none" : "block";

    // 2. 「次へ」/「送信」ボタンのテキストと表示制御
    if (currentStep === 0) {
      // 最初のブース説明画面
      nextBtn.style.display = "block";
      nextBtn.textContent = "✨ 占いを始める";
      submitBtn.style.display = "none";
    } else if (currentStep === totalSteps - 1) {
      // 最後のQRコード入力画面
      nextBtn.style.display = "none";
      submitBtn.style.display = "block";
    } else {
      // 質問画面
      nextBtn.style.display = "block";
      nextBtn.textContent = "次の項目へ ▶";
      submitBtn.style.display = "none";
    }

    // 3. プログレスバーの更新
    const progressPercent = (currentStep / (totalSteps - 1)) * 100;
    document.getElementById("progress-bar").style.width = `${progressPercent}%`;

    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // 「次へ」/「占いを始める」ボタン押下時
  document.getElementById("next-btn").addEventListener("click", () => {
    // 質問ステップ（Step 1 〜 Step M）にいる場合のみ回答チェック
    if (currentStep >= 1 && currentStep <= questionCount) {
      const qIndex = currentStep - 1; // 質問の0インデックスに合わせる
      const selected = document.querySelector(`input[name="question_${qIndex}"]:checked`);
      if (!selected) {
        alert("選択肢を1つ選んでから「次の項目へ」に進んでください。");
        return;
      }
    }
    currentStep++;
    updateStepDisplay();
  });

  // 「前の項目へ」ボタン押下時
  document.getElementById("prev-btn").addEventListener("click", () => {
    if (currentStep > 0) {
      currentStep--;
      updateStepDisplay();
    }
  });

  // フォーム送信処理
  document.getElementById("fortune-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    
    const qrIndexInput = document.getElementById("qr-index");
    const qrIndex = qrIndexInput.value;

    // 各質問の回答を取得
    const answers = [];
    for (let i = 0; i < questionCount; i++) {
      const selected = document.querySelector(`input[name="question_${i}"]:checked`);
      if (selected) {
        answers.push(Number(selected.value));
      }
    }

    const payload = {
      action: "saveFortune",
      data: {
        boothName: booth,
        resultIndex: Number(qrIndex),
        answers: answers
      }
    };

    formView.style.display = "none";
    loadingView.style.display = "block";
    document.getElementById("loading-msg").textContent = "占い結果を計算・保存しています...";

    try {
      const response = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      });
      const json = await response.json();

      if (!json.success) throw new Error(json.message || "保存に失敗しました。");

      document.getElementById("submitted-qr-index").textContent = `No. ${qrIndex}`;

      loadingView.style.display = "none";
      successView.style.display = "block";
    } catch (err) {
      alert(err.message);
      loadingView.style.display = "none";
      formView.style.display = "block";
    }
  });

  // 「次の人を占う」ボタン
  document.getElementById("next-person-btn").addEventListener("click", () => {
    document.getElementById("fortune-form").reset();
    currentStep = 0;
    updateStepDisplay();

    successView.style.display = "none";
    formView.style.display = "block";
  });
</script>

</body>
</html>
