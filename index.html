<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase + GitHub Pages 連携デモ</title>
  <!-- Supabase JS Client (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 2rem; }
    input, textarea, button { padding: 0.5rem; font-size: 1rem; }
    .post-item { border-bottom: 1px solid #ccc; padding: 1rem 0; }
  </style>
</head>
<body>

  <h1>Supabase データの読み書き</h1>

  <!-- データ追加用フォーム -->
  <form id="postForm">
    <h3>新規投稿</h3>
    <input type="text" id="titleInput" placeholder="タイトル" required>
    <textarea id="contentInput" placeholder="内容" rows="3" required></textarea>
    <button type="submit">投稿する</button>
  </form>

  <!-- データ表示エリア -->
  <h2>投稿一覧</h2>
  <div id="postsContainer">読み込み中...</div>

  <script>
    // 1. Supabaseの初期化 (ご自身の情報に置き換えてください)
    const SUPABASE_URL = 'https://excljbqcjcckkdcipwuw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4Y2xqYnFjamNja2tkY2lwd3V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NzE5OTAsImV4cCI6MjEwMTE0Nzk5MH0.Ec-nd9Lb4wuZhmHgqb-AsEmM3HVirr7D2WTErxLehC4';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. データの取得 (READ)
    async function fetchPosts() {
      const container = document.getElementById('postsContainer');
      
      // 'posts' テーブルから全件取得（作成日時で降順ソート）
      const { data, error } = await supabase
        .from('posts')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('取得エラー:', error);
        container.innerText = 'データの取得に失敗しました。';
        return;
      }

      if (data.length === 0) {
        container.innerText = '投稿はまだありません。';
        return;
      }

      // HTMLに描画
      container.innerHTML = data.map(post => `
        <div class="post-item">
          <h3>${escapeHtml(post.title)}</h3>
          <p>${escapeHtml(post.content)}</p>
          <small>${new Date(post.created_at).toLocaleString()}</small>
        </div>
      `).join('');
    }

    // 3. データの書き込み (CREATE)
    document.getElementById('postForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const title = document.getElementById('titleInput').value;
      const content = document.getElementById('contentInput').value;

      // 'posts' テーブルに1行挿入
      const { data, error } = await supabase
        .from('posts')
        .insert([{ title, content }]);

      if (error) {
        console.error('追加エラー:', error);
        alert('投稿に失敗しました: ' + error.message);
      } else {
        // フォームをリセットして一覧を再取得
        document.getElementById('postForm').reset();
        fetchPosts();
      }
    });

    // 簡易的なXSS対策用関数
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    // 初期化時に一覧を取得
    fetchPosts();
  </script>
</body>
</html>
